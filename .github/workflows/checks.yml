name: Tracking checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -W error tracking_lab.py --self-test
      - run: python -W error -m unittest discover -s tests -v
      - run: python -W error export_workbench.py --check
      - run: node --check docs/app.js
      - run: node --test tests/viewer.test.cjs
